<!-- Card de prévia (Facebook, WhatsApp): o crawler lê estas tags e não roda o JavaScript abaixo -->

<meta property="og:url" content="https://labuu.com.br/baixar/" />

<meta property="og:description" content="Obra, pintura, elétrica e serviços gerais. Baixe grátis o app da Labuu na Play Store." />
<meta property="og:image" content="https://labuu.com.br/assets/og/labuu-og-conexao-v2.jpg" />
<meta property="og:image:width" content="2400" />
<meta property="og:image:height" content="1260" />
<meta property="og:image:alt" content="Ajudante e contratante apertando as mãos na obra, com o passo a passo do app Labuu" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" type="image/png" href="/assets/favicon.png" />
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #fff; color: #001743; text-align: center; padding: 24px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 16px; background: #E06A10; color: #fff; padding: 14px 28px; border-radius: 999px; font-weight: 700; text-decoration: none; }
</style>
<script>
  // Quem chega pelo link dos grupos vai direto para a Play Store; o referrer marca a origem no Play Console.
  var PLAY = "https://play.google.com/store/apps/details?id=app.labuu.com.br" +
    "&referrer=" + encodeURIComponent("utm_source=" + (new URLSearchParams(location.search).get("utm_source") || "facebook") +
    "&utm_medium=" + (new URLSearchParams(location.search).get("utm_medium") || "grupos") +
    "&utm_campaign=" + (new URLSearchParams(location.search).get("utm_campaign") || "conexao"));
  location.replace(PLAY);
</script>
</head>
<body>
  <div>
    <p>Abrindo a Play Store…</p>
    <a href="https://play.google.com/store/apps/details?id=app.labuu.com.br&amp;referrer=utm_source%3Dfacebook%26utm_medium%3Dgrupos%26utm_campaign%3Dconexao">Baixar a Labuu</a>
  </div>
</body>
